    const contenedor = document.getElementById("semestres");

    materias.forEach(m => {
        if (!niveles[m.nivel]) niveles[m.nivel] = [];
        niveles[m.nivel].push(m);
    });

    const botonesMap = {};
    // Utilizamos 'estados' para almacenar el estado (aprobado, regularizado o null/libre)
    // El formato es: [ID_Materia, 'aprobado' | 'regularizado']
    const estados = new Map(JSON.parse(localStorage.getItem("estados") || "[]")); 

    Object.entries(niveles).forEach(([nivel, ramos]) => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "semestre";
        const h2 = document.createElement("h2");
        h2.textContent = `Nivel ${nivel}`;
        tarjeta.appendChild(h2);

        ramos.forEach(ramo => {
            const btn = document.createElement("button");
            btn.className = "ramo";
            btn.textContent = ramo.nombre;
            btn.dataset.id = ramo.id;
            tarjeta.appendChild(btn);
            botonesMap[ramo.id] = btn;

            // Al inicio, asignamos la clase según el estado guardado
            const estadoGuardado = estados.get(ramo.id);
            if (estadoGuardado === 'aprobado') {
                btn.classList.add("aprobado");
            } else if (estadoGuardado === 'regularizado') {
                btn.classList.add("regularizado");
            }
        });

        contenedor.appendChild(tarjeta);
    });

    /**
     * Comprueba si una materia correlativa cumple con el requisito.
     * @param {number} idCorrelativa - ID de la materia pre-requisito.
     * @param {'cursada'|'aprobada'} tipoRequisito - El tipo de requisito ('cursada' o 'aprobada').
     * @returns {boolean} - true si cumple, false si no.
     */
    function cumpleCorrelativa(idCorrelativa, tipoRequisito) {
        const btnCorrelativa = botonesMap[idCorrelativa];
        
        // Las materias que no están en el mapa (ej. si falta alguna o es optativa) se asumen No Cumple.
        if (!btnCorrelativa) return false; 
        
        // 1. Requisito de APROBACIÓN (FINAL):
        if (tipoRequisito === 'aprobada') {
            // Debe tener la clase 'aprobado'
            return btnCorrelativa.classList.contains("aprobado");
        } 
        
        // 2. Requisito de CURSADA (REGULARIDAD):
        if (tipoRequisito === 'cursada') {
            // Debe tener la clase 'aprobado' O 'regularizado'
            return btnCorrelativa.classList.contains("aprobado") || btnCorrelativa.classList.contains("regularizado");
        }
        
        return false; // Por defecto no cumple
    }

    // Lógica para actualizar las clases de habilitado
    function actualizarHabilitados() {
        materias.forEach(m => {
            const btn = botonesMap[m.id];
            
            // Si la materia ya está aprobada o regularizada, no la marcamos como "habilitada para cursar".
            if (btn.classList.contains("aprobado") || btn.classList.contains("regularizado")) {
                 btn.classList.remove("habilitado");
                 return;
            }
            
            // Comprobamos que TODAS las correlativas cumplen con el requisito
            const estaHabilitada = m.correlativas.every(correlativa => 
                cumpleCorrelativa(correlativa.id, correlativa.tipo)
            );

            if (estaHabilitada) {
                btn.classList.add("habilitado");
            } else {
                btn.classList.remove("habilitado");
            }
        });
        
        // GUARDAR EL NUEVO ESTADO EN localStorage
        const nuevosEstados = Array.from(estados.entries());
        localStorage.setItem("estados", JSON.stringify(nuevosEstados));
    }

    // Lógica para cambiar de estado al hacer click
    Object.values(botonesMap).forEach(btn => {
        btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.id);
            let estadoActual = estados.get(id);

            // Ciclado de estados: null (Libre) -> regularizado -> aprobado -> null (Libre)
            if (estadoActual === 'aprobado') {
                estados.delete(id); // Borra el estado (vuelve a Libre)
                btn.classList.remove("aprobado", "regularizado", "habilitado"); 
            } else if (estadoActual === 'regularizado') {
                estados.set(id, 'aprobado'); // Pasa de Regularizada a Aprobada
                btn.classList.add("aprobado");
                btn.classList.remove("regularizado");
            } else { // estadoActual es null/undefined (Libre/Habilitada)
                estados.set(id, 'regularizado'); // Pasa de Libre/Habilitada a Regularizada
                btn.classList.add("regularizado");
                // Removemos la clase 'habilitado' porque ya se está cursando/regularizando
                btn.classList.remove("habilitado", "aprobado"); 
            }
            
            actualizarHabilitados();
        });
    });

    document.getElementById("reset").addEventListener("click", () => {
        Object.values(botonesMap).forEach(b => {
            b.classList.remove("aprobado", "regularizado", "habilitado");
        });
        localStorage.removeItem("estados");
        estados.clear(); // Limpiamos el mapa interno
        actualizarHabilitados();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Inicializar al cargar la página
    actualizarHabilitados();
